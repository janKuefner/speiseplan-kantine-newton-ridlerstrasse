<!-- VERSION: 2.2 (Timezone Fix) -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speiseplan NEWTON - Ridlerstraße 57</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f4f9; 
            color: #333; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        h1 { text-align: center; color: #2c3e50; }
        .day-card { 
            background: #fff; 
            border-radius: 8px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .day-title { 
            font-size: 1.2em; 
            font-weight: bold; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 5px; 
            margin-bottom: 15px; 
            color: #2980b9; 
        }
        .dish { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0; 
            border-bottom: 1px solid #eee; 
        }
        .dish:last-child { border-bottom: none; }
        .dish-name { flex: 1; padding-right: 15px; }
        .dish-price { 
            font-weight: bold; 
            background: #e8f4f8; 
            padding: 5px 10px; 
            border-radius: 5px; 
            color: #2c3e50; 
            white-space: nowrap; 
        }
        .error { color: #e74c3c; font-weight: bold; text-align: center; margin-top: 20px; }
        #debug-output { display: none; background: #222; color: #0f0; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin-top: 20px; }
        .version-info { text-align: center; color: #aaa; font-size: 0.8em; margin-top: 40px; }
    </style>
</head>
<body>

    <h1>Speiseplan: NEWTON - Ridlerstraße 57</h1>
    <div id="menu-container">Daten werden geladen...</div>
    <pre id="debug-output"></pre>
    <div class="version-info">v2.2</div>

    <script>
        fetch('./speiseplan.json?t=' + Date.now())
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(data => renderSpeiseplan(data))
            .catch(error => {
                const container = document.getElementById('menu-container');
                container.innerHTML = `<p class="error">Fehler beim Laden der speiseplan.json.<br><small>${error.message}</small></p>`;
                console.error('Fetch Error:', error);
            });

        function renderSpeiseplan(data) {
            const container = document.getElementById('menu-container');
            const debugEl = document.getElementById('debug-output');
            container.innerHTML = '';

            let daysData = {};

            const targetMenu = data.find(item => 
                item.speiseplanAdvanced && item.speiseplanAdvanced.id === 3667
            );

            if (!targetMenu || !targetMenu.speiseplanGerichtData) {
                container.innerHTML = '<p class="error">Keine Gerichte für das Restaurant (ID 3667) in der JSON gefunden.</p>';
                debugEl.style.display = 'block';
                debugEl.textContent = JSON.stringify(data, null, 2);
                return;
            }

            targetMenu.speiseplanGerichtData.forEach(gerichtKnoten => {
                const gericht = gerichtKnoten.speiseplanAdvancedGericht;
                const infos = gerichtKnoten.zusatzinformationen;

                if (!gericht || !gericht.datum) return;

                let dateObj = new Date(gericht.datum);
                
                // FIX: Zeitzone hart auf Berlin zwingen, damit 00:00:00 nicht auf den Vortag rutscht
                let weekday = dateObj.toLocaleDateString('de-DE', { 
                    timeZone: 'Europe/Berlin', 
                    weekday: 'long', 
                    day: '2-digit', 
                    month: '2-digit' 
                });

                let preisFormatiert = '';
                if (infos && infos.mitarbeiterpreisDecimal2 != null) {
                    preisFormatiert = infos.mitarbeiterpreisDecimal2.toFixed(2).replace('.', ',') + ' €';
                }

                if (!daysData[weekday]) {
                    daysData[weekday] = [];
                }

                daysData[weekday].push({
                    name: gericht.gerichtname || 'Unbekanntes Gericht',
                    preis: preisFormatiert
                });
            });

            for (const [day, dishes] of Object.entries(daysData)) {
                let card = document.createElement('div');
                card.className = 'day-card';

                let title = document.createElement('div');
                title.className = 'day-title';
                title.innerText = day;
                card.appendChild(title);

                dishes.forEach(dish => {
                    let dishRow = document.createElement('div');
                    dishRow.className = 'dish';
                    dishRow.innerHTML = `
                        <div class="dish-name">${dish.name}</div>
                        <div class="dish-price">${dish.preis}</div>
                    `;
                    card.appendChild(dishRow);
                });

                container.appendChild(card);
            }
        }
    </script>
</body>
</html>
