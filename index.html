<!-- VERSION: 1.3 -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speiseplan NEWTON - Ridlerstraße 57</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f4f9; 
            color: #333; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        h1 { text-align: center; color: #2c3e50; }
        .day-card { 
            background: #fff; 
            border-radius: 8px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .day-title { 
            font-size: 1.2em; 
            font-weight: bold; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 5px; 
            margin-bottom: 15px; 
            color: #2980b9; 
        }
        .dish { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0; 
            border-bottom: 1px solid #eee; 
        }
        .dish:last-child { border-bottom: none; }
        .dish-name { flex: 1; padding-right: 15px; }
        .dish-price { 
            font-weight: bold; 
            background: #e8f4f8; 
            padding: 5px 10px; 
            border-radius: 5px; 
            color: #2c3e50; 
            white-space: nowrap; 
        }
        .error { color: #e74c3c; font-weight: bold; text-align: center; margin-top: 20px; }
        #debug-output { display: none; background: #333; color: #0f0; padding: 10px; overflow-x: auto; font-size: 12px; }
        .version-info { text-align: center; color: #aaa; font-size: 0.8em; margin-top: 40px; }
    </style>
</head>
<body>

    <h1>Speiseplan: NEWTON - Ridlerstraße 57</h1>
    <div id="menu-container">Daten werden geladen...</div>
    <pre id="debug-output"></pre>
    <div class="version-info">v1.3</div>

    <script>
        const apiUrl = 'https://fruehaufgenuss-api-mt.konkaapps.de/kms-mt-webservices/webresources/entity.speiseplanadvanced/getdata/3402/1';
        const token = btoa('ws_live_user:iouumQvQG96a');

        // Localhost-kompatibler CORS Proxy (AllOrigins)
        // WICHTIG: AllOrigins wrappt die JSON-Antwort in ein "contents"-Feld. Das wird unten im Code entpackt.
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

        fetch(proxyUrl, {
            method: 'GET',
            headers: {
                'Authorization': 'Basic ' + token,
            }
        })
        .then(response => {
            if (!response.ok) throw new Error('HTTP Error: ' + response.status);
            return response.json();
        })
        .then(proxyData => {
            // AllOrigins packt die eigentliche API-Antwort als String in proxyData.contents
            const data = JSON.parse(proxyData.contents);
            document.getElementById('debug-output').textContent = JSON.stringify(data, null, 2);
            renderSpeiseplan(data);
        })
        .catch(error => {
            const container = document.getElementById('menu-container');
            container.innerHTML = `<p class="error">Fehler beim Laden der API. (CORS-Blockade oder Proxy-Fehler). Details in der Konsole.</p>`;
            console.error('Fetch Error:', error);
        });

        function renderSpeiseplan(data) {
            const container = document.getElementById('menu-container');
            container.innerHTML = ''; 

            let daysData = {}; 

            try {
                const tageArray = Array.isArray(data) ? data : (data.tage || data.tagesplaene || []);
                
                tageArray.forEach(tag => {
                    let dateStr = tag.datum || tag.date || tag.timestamp;
                    if (!dateStr) return;

                    let dateObj = new Date(dateStr);
                    let weekday = dateObj.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit' });

                    let linien = tag.linien || tag.ausgaben || tag.kategorien || [];
                    // Suche nach der ID 3667 für das Betriebsrestaurant HV (Newton)
                    let zielLinie = linien.find(l => l.id == 3667 || l.linieId == 3667);

                    if (zielLinie && zielLinie.speisen) {
                        daysData[weekday] = zielLinie.speisen.map(speise => {
                            let preis = speise.preis1 || speise.preis || speise.price || 0;
                            let preisFormatiert = (typeof preis === 'number' && preis > 10) 
                                ? (preis / 100).toFixed(2).replace('.', ',') + ' €' 
                                : preis + ' €';

                            return {
                                name: speise.name || speise.titel || 'Unbekanntes Gericht',
                                preis: preisFormatiert
                            };
                        });
                    }
                });

                if (Object.keys(daysData).length === 0) {
                    container.innerHTML = '<p class="error">Keine Daten für NEWTON (ID 3667) gefunden. (Struktur abweichend - siehe Debug-Konsole)</p>';
                    document.getElementById('debug-output').style.display = 'block';
                    return;
                }

                for (const [day, dishes] of Object.entries(daysData)) {
                    let card = document.createElement('div');
                    card.className = 'day-card';
                    
                    let title = document.createElement('div');
                    title.className = 'day-title';
                    title.innerText = day;
                    card.appendChild(title);

                    dishes.forEach(dish => {
                        let dishRow = document.createElement('div');
                        dishRow.className = 'dish';
                        dishRow.innerHTML = `
                            <div class="dish-name">${dish.name}</div>
                            <div class="dish-price">${dish.preis}</div>
                        `;
                        card.appendChild(dishRow);
                    });

                    container.appendChild(card);
                }

            } catch (err) {
                console.error("Fehler beim Parsen der Struktur:", err);
                container.innerHTML = '<p class="error">Fehler beim Auslesen der Speisen. JSON-Struktur hat sich geändert.</p>';
                document.getElementById('debug-output').style.display = 'block';
            }
        }
    </script>
</body>
</html>
